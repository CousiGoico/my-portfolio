site_name: CousiBlog - Mi Blog de Programación
site_description: Blog de artículos sobre programación, DevOps y desarrollo web
site_author: Cousi
site_url: https://cousi.es/my-portfolio

theme:
  name: material
  language: es
  icon:
    logo: material/code-braces
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es
  - blog:
      blog_dir: .
      categories_file: null

markdown_extensions:
  - admonition
  - codehilite:
      linenums: true
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

